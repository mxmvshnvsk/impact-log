# Прод-окружение. Переменные — из .env рядом с этим файлом (шаблон: .env.example).
# Наружу опубликован только Caddy; api и db доступны лишь во внутренних сетях.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: ghcr.io/${GHCR_OWNER}/impact-log-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge
    logging: *logging

  api:
    image: ghcr.io/${GHCR_OWNER}/impact-log-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required (openssl rand -hex 32)}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      REGION: ${REGION:-ru-1}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      SYNC_RATE_LIMIT_MAX: ${SYNC_RATE_LIMIT_MAX:-120}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - backend
    logging: *logging

  migrate:
    image: ghcr.io/${GHCR_OWNER}/impact-log-api:${IMAGE_TAG:-latest}
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # ключ HMAC логина выводится из него (миграция 0006 переводит существующие аккаунты)
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required (openssl rand -hex 32)}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging: *logging

networks:
  edge: {}
  backend:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
