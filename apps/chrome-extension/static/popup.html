<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>impact log</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <span class="logo">
          <span class="logo__mark"><img src="icons/icon-32.png" alt="" width="20" height="20" /></span>
          <span>impact log</span>
        </span>
        <button
          type="button"
          class="icon-button"
          id="open-settings"
          data-i18n-aria-label="openSettings"
          data-i18n-title="openSettings"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
          </svg>
        </button>
      </header>

      <form id="capture-form" class="popup__form" novalidate>
        <div class="field">
          <label class="field__label" for="title" data-i18n="fieldTitle">What did you do?</label>
          <input
            id="title"
            name="title"
            class="input"
            type="text"
            maxlength="200"
            autocomplete="off"
            aria-describedby="title-error"
            data-i18n-placeholder="fieldTitlePlaceholder"
          />
          <p class="field__error" id="title-error" hidden></p>
        </div>

        <div class="field">
          <div class="field__head">
            <label class="field__label" for="link" data-i18n="fieldLink">Link</label>
            <span id="link-kind" class="badge" hidden></span>
          </div>
          <input
            id="link"
            name="link"
            class="input input--mono"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="link-kind link-error"
          />
          <p class="field__error" id="link-error" hidden></p>
        </div>

        <div class="field" id="selection-field" hidden>
          <div class="field__head">
            <label class="field__label" for="selection" data-i18n="fieldSelection">Selected text</label>
            <div class="segmented segmented--sm" role="radiogroup" data-i18n-aria-label="selectionPlacement">
              <label class="segmented__item">
                <input type="radio" name="placement" value="quote" checked />
                <span data-i18n="selectionAsQuote">As a quote</span>
              </label>
              <label class="segmented__item">
                <input type="radio" name="placement" value="description" />
                <span data-i18n="selectionToDescription">Into description</span>
              </label>
            </div>
          </div>
          <textarea id="selection" name="selection" class="input popup__selection" rows="2"></textarea>
        </div>

        <details class="disclosure" id="description-details">
          <summary class="disclosure__summary">
            <span id="description-label" data-i18n="fieldDescription">Description</span>
            <span class="field__optional">· <span data-i18n="optional">optional</span></span>
          </summary>
          <textarea
            id="description"
            name="description"
            class="input"
            rows="3"
            aria-labelledby="description-label"
          ></textarea>
        </details>

        <div class="field">
          <div class="field__head">
            <span class="field__label" id="score-label" data-i18n="fieldScore">Impact</span>
            <span class="score__caption" id="score-caption" aria-live="polite"></span>
          </div>
          <div
            class="segmented"
            id="score-group"
            role="radiogroup"
            aria-labelledby="score-label"
            aria-describedby="score-caption"
          >
            <label class="segmented__item"><input type="radio" name="score" value="1" /><span>1</span></label>
            <label class="segmented__item"><input type="radio" name="score" value="2" /><span>2</span></label>
            <label class="segmented__item"><input type="radio" name="score" value="3" /><span>3</span></label>
            <label class="segmented__item"><input type="radio" name="score" value="4" /><span>4</span></label>
            <label class="segmented__item"><input type="radio" name="score" value="5" /><span>5</span></label>
          </div>
        </div>

        <div class="popup__row">
          <div class="field">
            <label class="field__label" for="categories" data-i18n="fieldCategories">Categories</label>
            <input
              id="categories"
              name="categories"
              class="input"
              type="text"
              autocomplete="off"
              aria-describedby="list-hint"
              data-i18n-placeholder="placeholderCategories"
            />
          </div>
          <div class="field">
            <label class="field__label" for="labels" data-i18n="fieldLabels">Labels</label>
            <input
              id="labels"
              name="labels"
              class="input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="list-hint"
              data-i18n-placeholder="placeholderLabels"
            />
          </div>
          <p class="visually-hidden" id="list-hint" data-i18n="hintCommaSeparated">Comma separated</p>
          <ul class="labels-preview" id="labels-preview" aria-hidden="true" hidden></ul>
        </div>

        <div class="popup__footer">
          <p class="alert" id="form-error" role="alert" hidden></p>
          <button type="submit" class="button button--primary button--block">
            <span data-i18n="submit">Open in impact log</span>
            <kbd class="kbd" id="shortcut" aria-hidden="true"></kbd>
          </button>
          <p class="note">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <span data-i18n="privacyNote">The draft goes in the link, not via a server.</span>
          </p>
        </div>
      </form>
    </main>
  </body>
</html>
